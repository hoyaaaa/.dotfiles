# 상태바 기본
set -g status on
set -g status-interval 1
set -g mouse on
set -g default-terminal "tmux-256color"

# Catppuccin Latte
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "#{@thm_crust}"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# 왼쪽: 세션 이름 + 창
set -g status-left "#[bold]#S #[default]| "

# 오른쪽 상태 정보
set -g status-right-length 200
set -g status-left-length 60
set -g status-right "⌨ #(im-select | sed 's/.*ABC/EN/;s/.*Korean.2SetKorean/KO/') | git #(cd #{pane_current_path} 2>/dev/null && git rev-parse --abbrev-ref HEAD 2>/dev/null)#{?pane_in_mode, (copy),}#(cd #{pane_current_path} 2>/dev/null && git diff --quiet 2>/dev/null || echo '*') | load #(sysctl -n vm.loadavg | awk '{print $2}') | %Y-%m-%d %H:%M"

# 창 제목 자동 갱신
set -g set-titles on
set -g set-titles-string "#{pane_current_command} — #{pane_current_path}"
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
