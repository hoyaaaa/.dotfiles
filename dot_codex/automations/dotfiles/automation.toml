prompt = "dotfiles-config와 secretive 스킬을 적용하고 /Users/hoya/.dotfiles/bin/dotfiles sync를 실행한다. 이 저장소는 사용자가 main 직접 서명 커밋·푸시를 허용했다. 로컬 설정·설치 목록을 검사·서명 커밋하고, 원격 main은 앞서 있거나 분기돼도 pull·서명 병합으로 통합한 뒤 저장소 관리 전역 지침·사용자 스킬을 적용하고 일반 푸시와 원격 SHA 확인까지 완료한다. 이전 동기화가 서명 실패 등으로 남긴 staged 변경은 .git/dotfiles-sync.pending의 HEAD/index tree 지문이 일치하면 재검사하고 자동 재개한다. 다른 작업의 staged 변경, 실제 병합·전역 파일 충돌, 검사·인증·서명 실패는 원본을 보존한다. 서명을 끄거나 force push하지 않으며 새 파일은 무조건 추가하지 않는다. 내장·플러그인·앱 소유 스킬과 시크릿을 덮어쓰거나 비밀 값을 출력하지 않는다. snapshot-state.json에서 완료/실패를 확인한다. 정상 실행은 조용히 유지한다. 같은 실패의 반복은 이전 알림을 확인해 중복 알림하지 말고, 원인·상태가 바뀌거나 새 사용자 조치가 필요할 때만 알린다. 실패 상태를 자신의 미완료 작업과 구분해 자동 재개 가능한 작업은 먼저 처리한다."
